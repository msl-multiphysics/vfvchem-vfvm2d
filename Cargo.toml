[package]
name = "vfvchem_vfvm2d"
version = "0.1.0"
edition = "2024"

[dependencies]
faer = "0.24.0"
faer_gmres = "0.5.0"
itertools = "0.13"
spade = "2"
thiserror = "1"
rand = "0.9"

[[example]]
name = "flow_lid"
path = "examples/flow/flow_lid.rs"

[[example]]
name = "flow_step"
path = "examples/flow/flow_step.rs"

[[example]]
name = "flow_tworeg"
path = "examples/flow/flow_tworeg.rs"

[[example]]
name = "heat_transient"
path = "examples/heat/heat_transient.rs"

[[example]]
name = "heat_tworeg"
path = "examples/heat/heat_tworeg.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package.faer]
opt-level = 3
