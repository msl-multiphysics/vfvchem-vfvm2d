[package]
name = "vfvchem_vfvm2d"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1.0"
rand = "0.9"
rslab = { git = "https://github.com/milanofthe/rslab", tag = "v1.7.0" }
simple_delaunay_lib = "0.2"
thiserror = "1"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[example]]
name = "heat_transient"
path = "examples/heat/heat_transient.rs"

[[example]]
name = "heat_diag"
path = "examples/heat/heat_diag.rs"

[[example]]
name = "heat_adapt"
path = "examples/heat/heat_adapt.rs"

[[example]]
name = "flow_lid"
path = "examples/flow/flow_lid.rs"

[[example]]
name = "flow_step"
path = "examples/flow/flow_step.rs"

[[example]]
name = "flow_diag"
path = "examples/flow/flow_diag.rs"

[[example]]
name = "heatflow_channel"
path = "examples/heatflow/heatflow_channel.rs"

[[example]]
name = "heatflow_step"
path = "examples/heatflow/heatflow_step.rs"

[[example]]
name = "mole_turing"
path = "examples/mole/mole_turing.rs"

[[example]]
name = "moleflow_bouy"
path = "examples/moleflow/moleflow_bouy.rs"

[[example]]
name = "moleflow_step"
path = "examples/moleflow/moleflow_step.rs"

[[example]]
name = "heatmoleflow_step"
path = "examples/heatmoleflow/heatmoleflow_step.rs"

[[example]]
name = "bench_vert"
path = "examples/benchmark/bench_vert.rs"

[[example]]
name = "bench_heat"
path = "examples/benchmark/bench_heat.rs"

[[example]]
name = "bench_flow"
path = "examples/benchmark/bench_flow.rs"

[[example]]
name = "bench_cavity"
path = "examples/benchmark/bench_cavity.rs"

[[example]]
name = "bench_graetz"
path = "examples/benchmark/bench_graetz.rs"

[[example]]
name = "bench_tayloraris"
path = "examples/benchmark/bench_tayloraris.rs"

[[example]]
name = "bench_vortex"
path = "examples/benchmark/bench_vortex.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package.rslab]
opt-level = 3
